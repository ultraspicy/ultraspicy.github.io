<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 200" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect width="520" height="200" fill="#f6f8fa" rx="10"/>
  <!-- boxes -->
  <rect x="30"  y="75" width="110" height="50" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <rect x="205" y="75" width="110" height="50" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <rect x="380" y="75" width="110" height="50" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <!-- labels -->
  <text x="85"  y="105" text-anchor="middle" font-size="15" fill="#1a1a1a">Client</text>
  <text x="260" y="105" text-anchor="middle" font-size="15" fill="#1a1a1a">API</text>
  <text x="435" y="105" text-anchor="middle" font-size="15" fill="#1a1a1a">Database</text>
  <!-- arrows -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6b7280"/>
    </marker>
  </defs>
  <line x1="140" y1="100" x2="205" y2="100" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="315" y1="100" x2="380" y2="100" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
